# @package model

_target_: dau_build.build_steps.HardwarePlanTask
# the plan is the composed plan group; select+configure with
# plan=plans/local-build-and-program plan.dau_core_root=... plan.smoke_command=...
plan: ${oc.select:plan,null}
# hardware access composes from the platform group's host_access
# (platform=platforms/<vendor>/<board>-<host>) and is changed there
# (platform.host_access.<field>=...); without a platform the facts stay
# unset and steps that need them fail with guidance (dau-build carries no
# board defaults)
platform: ${oc.select:platform,null}
# the programmer composes from the `programmer` group
# (programmer=programmers/<name>); with none, the platform's own
# programmer is used
programmer: ${oc.select:programmer,null}
work_root: ???
# the built shell manifest whose bitstream a programming plan loads
# (shell-build.artifacts.yaml); a raw bitstream path is for plans/recovery only
manifest: null
bitstream: null
vivado: vivado
vivado_invocation: standard
vivado_mount_root: null
openfpgaloader: openFPGALoader
execute: false
