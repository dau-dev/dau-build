# @package platform

# platform=platforms/example/probe — a FICTIONAL board.
#
# dau-build is generic platform integration and ships no real board: the DAU
# boards live in the private integration package, and a third party's board
# lives in theirs. What dau-build owes is a worked example of the shape one
# takes, so this file is both the template you copy and the board dau-build's
# own tests build against.
#
# Nothing here was measured. The part, identity word, budget, bus addresses
# and personality are invented to be internally consistent and plausible for
# a Kintex-7 x8 XDMA card -- never cite them as hardware facts, and never
# build a real design against this board.
_target_: dau_build.platforms.PlatformDefinition
name: probe
part: xc7k325tffg676-2
platform_id: PRBE
program_method: jtag
spi_boot_buswidth: 4
width_tiers: [64, 128, 256]
# lane index -> GT channel site. A swizzled mapping like a real board's, so
# the pre-opt_design implementation hook has something non-trivial to emit.
lane_placements:
  - [7, GTXE2_CHANNEL_X0Y7]
  - [6, GTXE2_CHANNEL_X0Y6]
  - [5, GTXE2_CHANNEL_X0Y5]
  - [4, GTXE2_CHANNEL_X0Y4]
  - [3, GTXE2_CHANNEL_X0Y3]
  - [2, GTXE2_CHANNEL_X0Y2]
  - [1, GTXE2_CHANNEL_X0Y1]
  - [0, GTXE2_CHANNEL_X0Y0]
constraints_xdc: |
  # Example board pin constraints. GT channel LOCs (the lane swizzle) are
  # applied by the pre-opt_design implementation hook, never here: XDC-time
  # LOCs conflict with the XDMA IP's internal BEL/LOC constraints.

  set_property PACKAGE_PIN F6 [get_ports {pcie_clkin_clk_p[0]}]
  set_property PACKAGE_PIN E6 [get_ports {pcie_clkin_clk_n[0]}]

  set_property PACKAGE_PIN J1 [get_ports pci_reset]
  set_property IOSTANDARD LVCMOS33 [get_ports pci_reset]
  set_false_path -from [get_ports pci_reset]

  set_property BITSTREAM.CONFIG.SPI_BUSWIDTH 4 [current_design]
  set_property BITSTREAM.GENERAL.COMPRESS TRUE [current_design]
  set_property CONFIG_VOLTAGE 3.3 [current_design]
  set_property CFGBVS VCCO [current_design]
# Placeable datapath capacity, not raw part capacity: what a composition may
# actually place, i.e. available minus the shell infrastructure (XDMA, memory
# controller, interconnect) that a composition never prices.
budget:
  _target_: dau_build.platforms.ResourceBudget
  lut: 178800
  ff: 382600
  bram36: 415
  dsp: 810

ddr_staging:
  _target_: dau_build.platforms.DdrStaging
  tier: ddr
  # two input regions so a job can stage the next batch while one runs
  input_addresses: [0x00000000, 0x18000000]
  input_bytes: 0x18000000
  output_address: 0x30000000
  output_bytes: 0x10000000
  address_align: 0x1000

host_access:
  _target_: dau_build.platforms.HostAccess
  pci_id: "10ee:9034"
  endpoint_bdf: "0000:01:00.0"
  # the endpoint's direct upstream bridge: the secondary-bus reset target
  # that re-inits the PCIe core after a volatile reprogram
  reset_bridge_bdf: "0000:00:1c.4"
  privilege_prefix:
    - sudo
  # the bridge chain, rescanned bottom-up after reprogramming
  rescan_bdfs:
    - "0000:00:1c.4"
    - "0000:00:1c.0"
  runtime_pm_patterns:
    - Xilinx
    - "10ee:9034"
  runtime_pm_executable: dau-utils-pci-runtime-pm
  jtag_cable: digilent_hs2

storage_tiers:
  - _target_: dau_build.platforms.StorageTier
    name: bram
    technology: bram
    capacity_bytes: 1912320   # 415 BRAM36 x 4608 B, the budgeted envelope
    access: owned
  - _target_: dau_build.platforms.StorageTier
    name: ddr
    technology: ddr
    capacity_bytes: 2147483648
    access: shared
    mig_prj: probe_mig.prj
    bandwidth_bytes_per_s: 3200000000
    # the memory system's additions to the board XDC: the controller's
    # reference clock IOSTANDARD (pin placement lives in the MIG .prj) and
    # the calibration-complete LED
    constraints_xdc: |
      set_property IOSTANDARD LVDS_25 [get_ports sys_clk_clk_p]
      set_property IOSTANDARD LVDS_25 [get_ports sys_clk_clk_n]

      set_property PACKAGE_PIN H4 [get_ports LED_A4]
      set_property IOSTANDARD LVCMOS33 [get_ports LED_A4]

host_link:
  _target_: dau_build.platforms.HostLink
  interface: pcie-xdma
  pcie_lanes: 8
  expected_link_width: 8
  expected_link_speed_gts: 5.0
  # An illustrative personality, not a proven one. A real board's is
  # authoritative and byte-for-byte its bring-up core's value_src=user XCI
  # parameters -- quote every value so it survives ccflow's
  # coerce_numbers_to_str intact (e.g. "000" must not become "0").
  xdma_personality:
    _target_: dau_build.platforms.XdmaPersonality
    params:
      mode_selection: "Advanced"
      pl_link_cap_max_link_width: "X8"
      pl_link_cap_max_link_speed: "5.0_GT/s"
      axi_data_width: "128_bit"
      axisten_freq: "125"
      xdma_axi_intf_mm: "AXI_Memory_Mapped"
      xdma_rnum_chnl: "1"
      xdma_wnum_chnl: "1"
      axilite_master_en: "true"
      axilite_master_size: "128"
      axilite_master_scale: "Kilobytes"
      axil_master_64bit_en: "true"
      axil_master_prefetchable: "true"
      xdma_pcie_64bit_en: "true"
      xdma_pcie_prefetchable: "true"
      plltype: "QPLL1"
      vendor_id: "10EE"
      pf0_device_id: "9034"
